# hyprland.conf — minimal starter. Docs: https://wiki.hyprland.org/
# Test safely: `Hyprland` from a TTY, or nest with `Hyprland --help`.
$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
# See the wiki for the full option list — every option has a default;
# prefer explicit settings for anything you depend on.
